<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GPS Caddie</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e2a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GPS Caddie">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --navy:#0e2a4a; --navy2:#123657; --green:#1e7a45; --gold:#c9a44c;
    --paper:#f5f2ea; --ink:#122033; --red:#c0392b; --white:#fff; --blue:#2b6cb0;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;font-family:"Helvetica Neue",Arial,sans-serif;background:var(--navy)}
  #app{height:100%;display:flex;flex-direction:column}

  /* ---------- top bar ---------- */
  #topbar{background:var(--navy);color:var(--paper);padding:10px 14px 8px;display:flex;align-items:center;justify-content:space-between;z-index:1200}
  #courseBtn{background:transparent;border:none;color:var(--paper);text-align:left;line-height:1.05;cursor:pointer;padding:0}
  #courseBtn b{font-size:15px;letter-spacing:.1em;font-weight:700}
  #courseBtn b::after{content:" ▾";color:var(--gold);font-size:12px}
  #courseBtn span{display:block;font-size:9.5px;letter-spacing:.28em;color:var(--gold)}
  #modeToggle{background:transparent;border:1px solid rgba(201,164,76,.6);color:var(--gold);font-size:11px;letter-spacing:.1em;padding:7px 12px;border-radius:20px;cursor:pointer}
  #modeToggle.setup{background:var(--gold);color:var(--navy);border-color:var(--gold)}

  /* ---------- course picker ---------- */
  #coursePicker{position:fixed;inset:0;background:rgba(14,42,74,.6);display:none;z-index:2100}
  #coursePicker.open{display:flex;flex-direction:column;justify-content:flex-end}
  #coursePanel{background:var(--paper);border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
  #coursePanel h2{font-size:13px;letter-spacing:.2em;color:var(--navy);margin-bottom:12px}
  .courseRow{width:100%;display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid #ded7c6;border-radius:12px;padding:14px;margin-bottom:8px;cursor:pointer;text-align:left}
  .courseRow.cur{border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,164,76,.3)}
  .courseRow .cn{font-weight:800;color:var(--navy);font-size:15px}
  .courseRow .cm{font-size:11px;color:#5a6b80;margin-top:2px}
  .courseRow .badge{font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--green)}
  .courseRow .badge.warn{color:#a1892f}

  /* ---------- hole strip ---------- */
  #holestrip{background:var(--navy2);display:flex;overflow-x:auto;scrollbar-width:none;padding:6px 8px;gap:5px;z-index:1200}
  #holestrip::-webkit-scrollbar{display:none}
  .holechip{flex:0 0 auto;min-width:40px;padding:6px 4px;border-radius:8px;text-align:center;color:#9db3c9;background:transparent;border:1px solid transparent;cursor:pointer}
  .holechip .n{font-size:15px;font-weight:700;display:block}
  .holechip .p{font-size:9px;letter-spacing:.05em}
  .holechip.active{background:var(--paper);color:var(--navy);border-color:var(--gold)}
  .holechip.mapped .n::after{content:"•";color:var(--green);margin-left:2px}

  /* ---------- map ---------- */
  #map{flex:1;position:relative;z-index:1}
  .leaflet-control-attribution{font-size:9px}

  /* ---------- readout ---------- */
  #readout{background:var(--paper);color:var(--ink);padding:10px 16px calc(12px + env(safe-area-inset-bottom));z-index:1200;border-top:3px solid var(--gold)}
  #readout .row1{display:flex;align-items:baseline;justify-content:space-between}
  #holeinfo{font-size:13px;font-weight:700;letter-spacing:.04em}
  #holeinfo small{font-weight:400;color:#5a6b80}
  #teeYdg{font-size:11px;color:#5a6b80;margin-top:2px}
  .bigline{display:flex;align-items:baseline;justify-content:center;gap:10px;margin:2px 0 0}
  #distance{font-size:64px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
  #distance.stale{color:#8a97a8}
  .yd{font-size:16px;font-weight:600;color:var(--green);letter-spacing:.1em}
  #sub{display:flex;justify-content:center;gap:18px;font-size:11.5px;color:#5a6b80;margin-top:4px;font-variant-numeric:tabular-nums}
  #sub b{color:var(--ink)}
  #tapline{display:none;justify-content:center;font-size:12px;color:var(--blue);margin-top:3px;font-weight:600}
  #status{font-size:11px;text-align:center;color:#7a6a2c;margin-top:5px;min-height:14px}
  #actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  #actions button{flex:1 1 30%}
  #actions button{flex:1;border:none;border-radius:10px;padding:11px 0;font-size:12px;font-weight:700;letter-spacing:.03em;cursor:pointer}
  #btnDrive{background:var(--green);color:#fff}
  #btnShot{background:#2b6cb0;color:#fff}
  #btnShot.armed{background:#7a4bd0}
  #btnGPS{background:var(--navy);color:var(--paper)}
  #btnGPS.on{background:var(--green)}
  #btnNearest{background:#e6e0d2;color:var(--navy)}
  #btnScore{background:var(--gold);color:var(--navy)}
  #btnClearTap{background:#e6e0d2;color:var(--navy);display:none}

  /* setup banner */
  #setupBanner{display:none;background:var(--gold);color:var(--navy);font-size:12.5px;font-weight:600;text-align:center;padding:7px 12px;z-index:1200}
  body.setup #setupBanner{display:block}
  body.setup #btnNearest{display:none}
  #setupBanner button{margin-left:6px;background:var(--navy);color:var(--gold);border:none;border-radius:6px;padding:4px 8px;font-size:11px;cursor:pointer}

  /* tee selector */
  #tees{display:flex;gap:6px}
  .tee{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.15);cursor:pointer}
  .tee.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,164,76,.4)}

  .pinicon{background:transparent}
  .pinicon .flag{font-size:26px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
  .melabel{background:transparent}
  .melabel .dot{width:16px;height:16px;border-radius:50%;background:#2b6cb0;border:3px solid #fff;box-shadow:0 0 0 3px rgba(43,108,176,.35),0 1px 4px rgba(0,0,0,.5)}

  /* ---------- score sheet ---------- */
  #scoreSheet{position:fixed;left:0;right:0;bottom:0;top:0;background:rgba(14,42,74,.55);display:none;z-index:2000}
  #scoreSheet.open{display:flex;flex-direction:column;justify-content:flex-end}
  #scorePanel{background:var(--paper);border-radius:18px 18px 0 0;max-height:82%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
  #scoreHead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
  #scoreHead b{font-size:15px;letter-spacing:.05em;color:var(--navy)}
  #scoreHead .x{background:none;border:none;font-size:22px;color:var(--navy);cursor:pointer;padding:2px 8px}
  #scoreTabs{display:flex;gap:8px;padding:0 16px 10px}
  #scoreTabs button{flex:1;border:1px solid var(--navy);background:transparent;color:var(--navy);border-radius:8px;padding:8px 0;font-size:11px;font-weight:700;cursor:pointer}
  #scoreTabs button.on{background:var(--navy);color:var(--paper)}
  #scoreBody{overflow-y:auto;padding:0 16px 16px}
  .prow{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid #ded7c6;border-radius:12px;padding:10px 12px;margin-bottom:8px}
  .prow .pname{font-weight:700;color:var(--navy);font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .prow .ptot{font-size:11px;color:#5a6b80;margin-right:10px;white-space:nowrap}
  .stepper{display:flex;align-items:center;gap:2px}
  .stepper button{width:38px;height:38px;border-radius:10px;border:none;background:var(--navy);color:var(--paper);font-size:20px;font-weight:700;cursor:pointer}
  .stepper .val{width:44px;text-align:center;font-size:22px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
  .stepper .val.na{color:#b3a98f;font-size:16px}
  .statrow{display:flex;gap:6px;margin-top:8px}
  .statchip{flex:1;border:1px solid #cfc7b4;background:#f7f4ec;color:#5a6b80;border-radius:8px;padding:7px 0;font-size:11px;font-weight:700;letter-spacing:.03em;cursor:pointer;text-align:center}
  .statchip.yes{background:#1e7a45;border-color:#1e7a45;color:#fff}
  .statchip.no{background:#fbe9e7;border-color:#e0b4ad;color:#c0392b}
  .statchip.pen{background:#fff;color:var(--ink)}
  .statchip.pen.has{background:#c0392b;border-color:#c0392b;color:#fff}
  .scoreactions{display:flex;gap:8px;margin-top:6px}
  .scoreactions button{flex:1;border:none;border-radius:10px;padding:10px 0;font-size:12px;font-weight:700;cursor:pointer;background:#e6e0d2;color:var(--navy)}
  .scoreactions .danger{color:var(--red)}
  table.card{width:100%;border-collapse:collapse;font-size:11px;font-variant-numeric:tabular-nums}
  table.card th,table.card td{border:1px solid #d8d0bd;padding:4px 2px;text-align:center}
  table.card th{background:var(--navy);color:var(--paper);font-weight:700}
  table.card td.hn{background:#eee8d9;font-weight:700}
  table.card td.tot{background:#eee8d9;font-weight:800}
  table.card .under{color:var(--red);font-weight:700}
  table.card .over{color:var(--blue)}
  .topar{font-size:12px;text-align:center;color:#5a6b80;margin-top:8px}
  .topar b{color:var(--navy)}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <button id="courseBtn"><b>COURSE</b><span>GPS CADDIE</span></button>
    <div style="display:flex;align-items:center;gap:10px">
      <div id="tees"></div>
      <button id="modeToggle">SETUP</button>
    </div>
  </div>

  <div id="setupBanner">Tap the <b id="setupWhat">centre of the green</b> for Hole <span id="setupHole">1</span>
    <button id="setupTarget">TARGET: GREEN</button>
    <button id="setupNext">Save & next ▸</button>
    <button id="btnExport">EXPORT</button>
  </div>

  <div id="holestrip"></div>
  <div id="map"></div>

  <div id="readout">
    <div class="row1">
      <div>
        <div id="holeinfo">Hole 1</div>
        <div id="teeYdg"></div>
      </div>
      <div style="text-align:right;font-size:11px;color:#5a6b80" id="gpsmeta">GPS off</div>
    </div>
    <div class="bigline"><span id="distance">—</span><span class="yd">YDS</span></div>
    <div id="sub"><span>to centre of green</span></div>
    <div id="tapline"></div>
    <div id="status"></div>
    <div id="actions">
      <button id="btnGPS">START GPS</button>
      <button id="btnScore">SCORE</button>
      <button id="btnDrive">DRIVE</button>
      <button id="btnShot">SHOT</button>
      <button id="btnNearest">NEAREST HOLE</button>
      <button id="btnClearTap">CLEAR TAP</button>
    </div>
  </div>
</div>

<div id="coursePicker">
  <div id="coursePanel">
    <h2>CHOOSE COURSE</h2>
    <div id="courseList"></div>
  </div>
</div>

<div id="clubSheet" style="position:fixed;inset:0;background:rgba(14,42,74,.55);display:none;z-index:2200">
  <div style="background:var(--paper);border-radius:18px 18px 0 0;position:absolute;left:0;right:0;bottom:0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <b style="font-size:13px;letter-spacing:.15em;color:var(--navy)" id="clubTitle">WHICH CLUB?</b>
      <button id="clubSkip" style="background:none;border:none;color:#5a6b80;font-size:12px;font-weight:700;cursor:pointer">SKIP</button>
    </div>
    <div id="clubGrid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:7px"></div>
  </div>
</div>

<div id="scoreSheet">
  <div id="scorePanel">
    <div id="scoreHead"><b id="scoreTitle">SCORE</b><button class="x" id="scoreClose">✕</button></div>
    <div id="scoreTabs">
      <button id="tabHole" class="on">THIS HOLE</button>
      <button id="tabCard">SCORECARD</button>
      <button id="tabHist">ROUNDS</button>
      <button id="tabDrives">DRIVES</button>
    </div>
    <div id="scoreBody"></div>
  </div>
</div>

/* ===================================================================== */

const TEE_RADIUS_Y = 40;
const M2Y = 1.09361;

let courseId = null, C = null;          // current course object
let mode="play", curHole=1, tee=null, setupTarget="green";

let myPos=null, watchId=null, lastFix=0, tapTarget=null;

const $=id=>document.getElementById(id);
const holeNums=()=>Object.keys(C.holes).map(Number).sort((a,b)=>a-b);
const lastHole=()=>holeNums()[holeNums().length-1];
const numPar=h=>parseInt(C.holes[h].par);
const holeLabel=h=>C.holes[h].label||h;
const outCount=()=>C.outCount||Math.ceil(holeNums().length/2);
function setStatus(s){$("status").textContent=s;}
function distYds(a,b){
  const R=6371000,toR=x=>x*Math.PI/180;
  const dLat=toR(b[0]-a[0]),dLng=toR(b[1]-a[1]);
  const s=Math.sin(dLat/2)**2+Math.cos(toR(a[0]))*Math.cos(toR(b[0]))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s))*M2Y;
}

/* ---------------- course switching ---------------- */
function loadCourse(id, firstLoad){
  courseId=id; C=COURSES[id];
  try{localStorage.setItem("app:course",id);}catch(e){}
  // per-course data: baked + local overrides
  let localG={}, localT={};
  try{const v=localStorage.getItem(id+":greens"); if(v) localG=JSON.parse(v);}catch(e){}
  try{const v=localStorage.getItem(id+":tees");  if(v) localT=JSON.parse(v);}catch(e){}
  greens={...(C.greens||{}),...localG};
  teePts={...(C.teePts||{}),...localT};
  // tee preference
  tee=null;
  try{tee=localStorage.getItem(id+":tee");}catch(e){}
  if(!tee || !C.tees.some(t=>t.id===tee)) tee=C.tees[0].id;
  // players per course
  players=[{name:"Me",scores:{}}];
  try{const v=localStorage.getItem(id+":players"); if(v){const p=JSON.parse(v); if(Array.isArray(p)&&p.length)players=p;}}catch(e){}
  // UI
  $("courseBtn").innerHTML=`<b>${C.short}</b><span>GPS CADDIE</span>`;
  renderTeeDots();
  renderMarkers();
  tapTarget=null; clearTapUI();
  selectHole(holeNums()[0]);
  if(!firstLoad || !myPos) map.setView(C.center, 16);
  closeCoursePicker();
}
function saveMapped(){
  try{
    localStorage.setItem(courseId+":greens",JSON.stringify(greens));
    localStorage.setItem(courseId+":tees",JSON.stringify(teePts));
  }catch(e){setStatus("Couldn't save — storage unavailable");}
}
function saveScores(){
  try{localStorage.setItem(courseId+":players",JSON.stringify(players));}catch(e){}
}
function loadDrives(){
  try{const v=localStorage.getItem(courseId+":drives"); if(v) return JSON.parse(v);}catch(e){}
  return {};
}
function saveDrives(d){
  try{localStorage.setItem(courseId+":drives",JSON.stringify(d));}catch(e){}
}
const CLUBS=["Dr","3W","5W","Hy","4i","5i","6i","7i","8i","9i","PW","GW","SW","LW"];
let clubCb=null, shotStart=null;
function pickClub(title,cb){
  clubCb=cb;
  $("clubTitle").textContent=title;
  const g=$("clubGrid"); g.innerHTML="";
  CLUBS.forEach(c=>{
    const btn=document.createElement("button");
    btn.textContent=c;
    btn.style.cssText="border:1px solid #cfc7b4;background:#fff;color:var(--navy);border-radius:10px;padding:12px 0;font-size:14px;font-weight:800;cursor:pointer";
    btn.onclick=()=>{$("clubSheet").style.display="none";const f=clubCb;clubCb=null;f(c);};
    g.appendChild(btn);
  });
  $("clubSheet").style.display="block";
}
$("clubSkip").onclick=()=>{$("clubSheet").style.display="none";const f=clubCb;clubCb=null;if(f)f(null);};
$("clubSheet").onclick=e=>{if(e.target.id==="clubSheet")$("clubSkip").onclick();};

function loadClubs(){
  try{const v=localStorage.getItem("app:clubs"); if(v) return JSON.parse(v);}catch(e){}
  return {};
}
function saveClub(club,d){
  if(!club)return;
  const cs=loadClubs();
  if(!cs[club])cs[club]=[];
  cs[club].unshift({d:d,t:new Date().toISOString().slice(0,10)});
  cs[club]=cs[club].slice(0,30);
  try{localStorage.setItem("app:clubs",JSON.stringify(cs));}catch(e){}
}
function recordShot(){
  if(!myPos){setStatus("Start GPS first.");return;}
  if(!shotStart){
    shotStart=[...myPos];
    $("btnShot").textContent="SHOT: END";
    $("btnShot").classList.add("armed");
    setStatus("Shot armed at your position — hit, walk to your ball, tap SHOT: END.");
    return;
  }
  const d=Math.round(distYds(shotStart,myPos));
  shotStart=null;
  $("btnShot").textContent="SHOT";
  $("btnShot").classList.remove("armed");
  if(d<5){setStatus("Only "+d+" yds — shot cancelled.");return;}
  pickClub("SHOT: "+d+" YDS — WHICH CLUB?",club=>{
    saveClub(club,d);
    if(club){
      const arr=loadClubs()[club].map(x=>x.d);
      const avg=Math.round(arr.reduce((a,b)=>a+b,0)/arr.length);
      setStatus(`${club}: ${d} yds ✔ (avg ${avg} over ${arr.length})`);
    }else setStatus(`Shot: ${d} yds (no club tagged)`);
  });
}
function recordDrive(){
  if(!myPos){setStatus("Start GPS first, then tap DRIVE from your ball.");return;}
  const tp=teePts[curHole];
  if(!tp){setStatus("No tee mapped for this hole — can't measure the drive.");return;}
  const d=Math.round(distYds([tp.lat,tp.lng],myPos));
  if(d<30){setStatus("Only "+d+" yds from the tee — walk to your ball, then tap DRIVE.");return;}
  if(d>450 && !confirm(d+" yds?! Record this monster drive?"))return;
  const drives=loadDrives();
  if(!drives[curHole]) drives[curHole]=[];
  drives[curHole].unshift({d:d,t:new Date().toISOString().slice(0,10)});
  drives[curHole]=drives[curHole].slice(0,20);
  saveDrives(drives);
  const arr=drives[curHole].map(x=>x.d);
  const avg=Math.round(arr.reduce((a,b)=>a+b,0)/arr.length);
  setStatus(`Drive on hole ${holeLabel(curHole)}: ${d} yds ✔  (avg ${avg} · best ${Math.max(...arr)})`);
  pickClub("DRIVE: "+d+" YDS — WHICH CLUB?",club=>{ if(club)saveClub(club,d); });
}
function loadHistory(){
  try{const v=localStorage.getItem("app:history"); if(v) return JSON.parse(v);}catch(e){}
  return [];
}
function saveHistory(h){
  try{localStorage.setItem("app:history",JSON.stringify(h.slice(0,50)));}catch(e){}
}
function finishRound(){
  const active=players.filter(p=>Object.keys(p.scores).length>0);
  if(!active.length){setStatus("No scores to save yet.");return;}
  if(!confirm("Save this round to history and clear the card for a fresh round?"))return;
  const hist=loadHistory();
  const today=new Date().toISOString().slice(0,10);
  // bundle today's drives at this course into the round snapshot
  const drv=loadDrives(); const roundDrives={};
  for(const h in drv){
    const todays=drv[h].filter(x=>x.t===today).map(x=>x.d);
    if(todays.length) roundDrives[h]=todays;
  }
  hist.unshift({
    d:today,
    c:courseId,
    players:active.map(p=>{const st=pStats(p);return{name:p.name,tot:st.tot,toPar:st.toPar,played:st.played,scores:{...p.scores},stats:p.stats?JSON.parse(JSON.stringify(p.stats)):undefined,fwH:st.fwH,fwT:st.fwT,girH:st.girH,girT:st.girT,pen:st.pen,putts:st.putts,puttHoles:st.puttHoles};}),
    drives:Object.keys(roundDrives).length?roundDrives:undefined
  });
  saveHistory(hist);
  players.forEach(p=>p.scores={}); saveScores();
  scoreTab="hist"; renderScore();
}

/* ---------------- course picker ---------------- */
function openCoursePicker(){
  const list=$("courseList"); list.innerHTML="";
  for(const id in COURSES){
    const c=COURSES[id];
    const mapped=Object.keys(c.greens||{}).length;
    const total=Object.keys(c.holes).length;
    const row=document.createElement("button");
    row.className="courseRow"+(id===courseId?" cur":"");
    row.innerHTML=`<span><span class="cn">${c.name}</span><br><span class="cm">${total} holes · par ${coursePar(c)}</span></span>
      <span class="badge ${mapped>=total?"":"warn"}">${mapped>=total?"READY":mapped+"/"+total+" GREENS"}</span>`;
    row.onclick=()=>loadCourse(id,false);
    list.appendChild(row);
  }
  $("coursePicker").classList.add("open");
}
function closeCoursePicker(){$("coursePicker").classList.remove("open");}
function coursePar(c){
  let p=0; for(const h in c.holes){ if(!c.holes[h].alt) p+=parseInt(c.holes[h].par); } return p;
}
$("courseBtn").onclick=openCoursePicker;
$("coursePicker").onclick=e=>{if(e.target.id==="coursePicker")closeCoursePicker();};

/* ---------------- tee dots ---------------- */
function renderTeeDots(){
  const box=$("tees"); box.innerHTML="";
  C.tees.forEach(t=>{
    const d=document.createElement("div");
    d.className="tee"+(t.id===tee?" sel":"");
    d.style.background=t.color;
    d.title=t.label;
    d.onclick=()=>{
      tee=t.id;
      try{localStorage.setItem(courseId+":tee",tee);}catch(e){}
      renderTeeDots(); showHoleInfo(); updateReadout();
    };
    box.appendChild(d);
  });
}
function teeLabel(){const t=C.tees.find(x=>x.id===tee);return t?t.label:tee;}

/* ---------------- markers / strip ---------------- */
function renderMarkers(){
  Object.values(greenMarkers).forEach(m=>map.removeLayer(m)); greenMarkers={};
  Object.values(teeMarkers).forEach(m=>map.removeLayer(m)); teeMarkers={};
  for(const h in greens){
    greenMarkers[h]=L.marker([greens[h].lat,greens[h].lng],{icon:flagIcon(holeLabel(h))}).addTo(map)
      .on("click",()=>selectHole(+h));
  }
  for(const h in teePts){
    teeMarkers[h]=L.marker([teePts[h].lat,teePts[h].lng],{icon:teeIcon(holeLabel(h))}).addTo(map)
      .on("click",()=>selectHole(+h));
  }
  renderStrip();
}
function renderStrip(){
  const s=$("holestrip"); s.innerHTML="";
  holeNums().forEach(h=>{
    const d=document.createElement("div");
    d.className="holechip"+(h===curHole?" active":"")+(greens[h]?" mapped":"");
    d.innerHTML=`<span class="n">${holeLabel(h)}</span><span class="p">P${C.holes[h].par}</span>`;
    d.onclick=()=>selectHole(h);
    s.appendChild(d);
  });
  document.querySelector(".holechip.active")?.scrollIntoView({inline:"center",behavior:"smooth"});
}
function showHoleInfo(){
  const d=C.holes[curHole];
  $("holeinfo").innerHTML=`Hole ${holeLabel(curHole)} <small>· Par ${d.par}${d.hcp?" · Hcp "+d.hcp:""}</small>`;
  $("teeYdg").innerHTML=C.tees.map(t=>{
    const v=d.y[t.id]??"–";
    const col=t.color==="#ffffff"?"#5a6b80":t.color;
    return t.id===tee?`<b style="color:${col}">${v}</b>`:`<span style="color:${col}">${v}</span>`;
  }).join(" / ")+" yds";
}
function selectHole(h){
  curHole=h; tapTarget=null; clearTapUI();
  $("setupHole").textContent=holeLabel(h);
  showHoleInfo();
  if(greens[h]){
    const g=[greens[h].lat,greens[h].lng];
    if(myPos && mode==="play") map.fitBounds(L.latLngBounds([myPos,g]).pad(0.25));
    else map.setView(g,17);
  }
  renderStrip(); updateReadout();
}

/* ---------------- GPS ---------------- */
function startGPS(){
  if(!navigator.geolocation){setStatus("Geolocation not supported in this browser.");return;}
  if(watchId!==null){stopGPS();return;}
  setStatus("Requesting location…");
  watchId=navigator.geolocation.watchPosition(p=>{
    myPos=[p.coords.latitude,p.coords.longitude]; lastFix=Date.now();
    $("gpsmeta").innerHTML=`GPS ±${Math.round(p.coords.accuracy*M2Y)}y`;
    if(!meMarker){meMarker=L.marker(myPos,{icon:meIcon}).addTo(map); map.setView(myPos,17);}
    else meMarker.setLatLng(myPos);
    updateReadout();
  },err=>{
    stopGPS();
    setStatus(err.code===1
      ?"Location blocked. Allow location for your browser in phone settings, then reload."
      :"GPS error: "+err.message);
  },{enableHighAccuracy:true,maximumAge:2000,timeout:15000});
  $("btnGPS").textContent="GPS ON"; $("btnGPS").classList.add("on");
}
function stopGPS(){
  if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null;}
  $("btnGPS").textContent="START GPS"; $("btnGPS").classList.remove("on");
  $("gpsmeta").textContent="GPS off";
}

/* ---------------- readout ---------------- */
function updateReadout(){
  const dEl=$("distance"), sub=$("sub");
  const g=greens[curHole];
  if(!g){dEl.textContent="—";sub.innerHTML="<span>green not mapped yet — use Setup</span>";drawLines();return;}
  if(!myPos){dEl.textContent="—";sub.innerHTML="<span>to centre of green · start GPS</span>";drawLines();return;}
  const gp=[g.lat,g.lng];
  const d=Math.round(distYds(myPos,gp));
  const tp=teePts[curHole];
  const cardY=C.holes[curHole].y[tee];
  const onTee=tp && cardY!=null && distYds(myPos,[tp.lat,tp.lng])<=TEE_RADIUS_Y;
  if(onTee){
    dEl.textContent=cardY;
    sub.innerHTML=`<span>scorecard · <b>${teeLabel()}</b> tees</span><span>GPS line: <b>${d}</b></span>`;
  }else{
    dEl.textContent=d;
    if(g.front||g.back){
      const parts=[];
      if(g.front) parts.push(`<span>F <b>${Math.round(distYds(myPos,[g.front.lat,g.front.lng]))}</b></span>`);
      parts.push(`<span>C <b>${d}</b></span>`);
      if(g.back) parts.push(`<span>B <b>${Math.round(distYds(myPos,[g.back.lat,g.back.lng]))}</b></span>`);
      sub.innerHTML=parts.join("");
    }else{
      sub.innerHTML=`<span>to centre of green</span>`;
    }
  }
  dEl.classList.toggle("stale",Date.now()-lastFix>10000);
  if(tapTarget){
    const a=Math.round(distYds(myPos,tapTarget));
    const b=Math.round(distYds(tapTarget,gp));
    $("tapline").style.display="flex";
    $("tapline").textContent=`Tap point: ${a} yds to it · ${b} yds from it to green`;
  }
  drawLines();
}
function drawLines(){
  if(lineToGreen){map.removeLayer(lineToGreen);lineToGreen=null;}
  if(lineToTap){map.removeLayer(lineToTap);lineToTap=null;}
  const g=greens[curHole];
  if(myPos&&g) lineToGreen=L.polyline([myPos,[g.lat,g.lng]],{color:"#c9a44c",weight:3,dashArray:"6 6",opacity:.9}).addTo(map);
  if(myPos&&tapTarget) lineToTap=L.polyline([myPos,tapTarget],{color:"#2b6cb0",weight:3,opacity:.9}).addTo(map);
}
function clearTapUI(){
  if(tapMarker){map.removeLayer(tapMarker);tapMarker=null;}
  $("tapline").style.display="none";
  $("btnClearTap").style.display="none";
  drawLines();
}

/* ---------------- map taps ---------------- */
map.on("click",e=>{
  if(mode==="setup"){
    const pt={lat:e.latlng.lat,lng:e.latlng.lng};
    if(setupTarget==="green"){
      const prev=greens[curHole]||{};
      greens[curHole]={...prev,lat:pt.lat,lng:pt.lng};
    }else if(setupTarget==="front"||setupTarget==="back"){
      if(!greens[curHole]){setStatus("Tap the green CENTRE first, then front/back edges.");return;}
      greens[curHole][setupTarget]=pt;
    }else teePts[curHole]=pt;
    saveMapped(); renderMarkers(); updateReadout();
    const names={green:"green centre",front:"green FRONT",back:"green BACK",tee:"tee box"};
    setStatus(`Hole ${holeLabel(curHole)} ${names[setupTarget]} saved ✔`);
  }else{
    tapTarget=[e.latlng.lat,e.latlng.lng];
    if(tapMarker) tapMarker.setLatLng(tapTarget);
    else tapMarker=L.circleMarker(tapTarget,{radius:7,color:"#2b6cb0",fillColor:"#2b6cb0",fillOpacity:.85}).addTo(map);
    $("btnClearTap").style.display="block";
    if(!myPos && greens[curHole]){
      const b=Math.round(distYds(tapTarget,[greens[curHole].lat,greens[curHole].lng]));
      $("tapline").style.display="flex";
      $("tapline").textContent=`Tap point: ${b} yds to green centre`;
      drawLines();
    } else updateReadout();
  }
});

/* ---------------- scoring ---------------- */
function pStats(p){
  const hs=holeNums(), half=outCount();
  let out=0,inn=0,parAcc=0,played=0;
  let fwH=0,fwT=0,girH=0,girT=0,pen=0,putts=0,puttHoles=0;
  hs.forEach((h,i)=>{
    const s=p.scores[h];if(s){(i<half?out+=s:inn+=s);parAcc+=numPar(h);played++;}
    const st=(p.stats||{})[h];
    if(st){
      if(st.fw==="y"){fwH++;fwT++;} else if(st.fw==="n"){fwT++;}
      if(st.gir==="y"){girH++;girT++;} else if(st.gir==="n"){girT++;}
      pen+=st.pen||0;
      if(st.putts){putts+=st.putts;puttHoles++;}
    }
  });
  return{out,inn,tot:out+inn,toPar:(out+inn)-parAcc,played,fwH,fwT,girH,girT,pen,putts,puttHoles};
}
const fmtToPar=n=>n===0?"E":(n>0?"+"+n:""+n);
function openScore(){$("scoreSheet").classList.add("open");renderScore();}
function closeScore(){$("scoreSheet").classList.remove("open");}
function esc(t){const d=document.createElement("div");d.textContent=t;return d.innerHTML;}

function renderScore(){
  $("scoreTitle").textContent=scoreTab==="hole"?`SCORE — HOLE ${holeLabel(curHole)} (PAR ${C.holes[curHole].par})`:(scoreTab==="card"?"SCORECARD — "+C.name.toUpperCase():(scoreTab==="drives"?"DRIVING DISTANCES":"ROUND HISTORY"));
  $("tabHole").classList.toggle("on",scoreTab==="hole");
  $("tabCard").classList.toggle("on",scoreTab==="card");
  $("tabHist").classList.toggle("on",scoreTab==="hist");
  $("tabDrives").classList.toggle("on",scoreTab==="drives");
  const b=$("scoreBody"); b.innerHTML="";
  if(scoreTab==="hole"){
    players.forEach((p,i)=>{
      const s=p.scores[curHole], st=pStats(p);
      if(!p.stats) p.stats={};
      const hs=p.stats[curHole]||{};
      const isPar3=numPar(curHole)===3;
      const row=document.createElement("div"); row.className="prow";
      row.style.flexWrap="wrap";
      const statHtml=i===0?`
        <span class="statrow" style="flex-basis:100%">
          ${isPar3?"":`<button class="statchip ${hs.fw==="y"?"yes":hs.fw==="n"?"no":""}" data-i="${i}" data-k="fw">FWY ${hs.fw==="y"?"✓":hs.fw==="n"?"✗":"–"}</button>`}
          <button class="statchip ${hs.gir==="y"?"yes":hs.gir==="n"?"no":""}" data-i="${i}" data-k="gir">GIR ${hs.gir==="y"?"✓":hs.gir==="n"?"✗":"–"}</button>
          <button class="statchip ${hs.putts?"yes":""}" data-i="${i}" data-k="putts">PUTTS ${hs.putts||"–"}</button>
          <button class="statchip pen ${hs.pen?"has":""}" data-i="${i}" data-k="pen">PEN ${hs.pen||0}</button>
        </span>`:"";
      row.innerHTML=`<span class="pname"></span><span class="ptot">${st.played? st.tot+" ("+fmtToPar(st.toPar)+")":""}</span>
        <span class="stepper">
          <button data-i="${i}" data-d="-1">−</button>
          <span class="val ${s?"":"na"}">${s||"–"}</span>
          <button data-i="${i}" data-d="1">+</button>
        </span>${statHtml}`;
      row.querySelector(".pname").textContent=p.name;
      row.querySelector(".pname").onclick=()=>renamePlayer(i);
      b.appendChild(row);
    });
    b.querySelectorAll(".statchip").forEach(chip=>chip.onclick=()=>{
      const p=players[+chip.dataset.i], k=chip.dataset.k;
      if(!p.stats) p.stats={};
      if(!p.stats[curHole]) p.stats[curHole]={};
      const h=p.stats[curHole];
      if(k==="pen"){ h.pen=((h.pen||0)+1)%4; if(!h.pen) delete h.pen; }
      else if(k==="putts"){ h.putts=((h.putts||0)+1)%5; if(!h.putts) delete h.putts; }
      else{ h[k]=h[k]==="y"?"n":(h[k]==="n"?undefined:"y"); if(h[k]===undefined) delete h[k]; }
      if(!Object.keys(h).length) delete p.stats[curHole];
      saveScores(); renderScore();
    });
    b.insertAdjacentHTML("beforeend",`<div class="scoreactions">
      <button id="addPlayer">+ ADD PLAYER</button>
      <button id="clearHole">CLEAR HOLE</button></div>
      <div class="scoreactions">
      <button id="finishRound" style="background:var(--navy);color:var(--paper)">FINISH & SAVE ROUND</button>
      <button id="newRound" class="danger">DISCARD ROUND</button></div>
      <div class="topar">Tap + to start at par · tap a name to rename · Finish & Save archives to the Rounds tab</div>`);
    b.querySelectorAll(".stepper button").forEach(btn=>btn.onclick=()=>{
      const p=players[+btn.dataset.i], d=+btn.dataset.d;
      let s=p.scores[curHole];
      if(!s) s=(d>0?numPar(curHole):null);
      else {s+=d; if(s<1)s=null;}
      if(s===null) delete p.scores[curHole]; else p.scores[curHole]=Math.min(s,15);
      saveScores(); renderScore();
    });
    $("addPlayer").onclick=()=>{
      if(players.length>=4){setStatus("Max 4 players.");return;}
      const n=prompt("Player name:"); if(!n)return;
      players.push({name:n.trim().slice(0,14),scores:{}}); saveScores(); renderScore();
    };
    $("clearHole").onclick=()=>{players.forEach(p=>delete p.scores[curHole]); saveScores(); renderScore();};
    $("finishRound").onclick=finishRound;
    $("newRound").onclick=()=>{
      if(confirm("Discard all scores for "+C.name+" WITHOUT saving?")){players.forEach(p=>p.scores={});saveScores();renderScore();}
    };
  }else if(scoreTab==="drives"){
    const drives=loadDrives();
    const hs=holeNums().filter(h=>drives[h]&&drives[h].length);
    if(!hs.length){
      let eh='<div class="topar">No drives recorded at '+C.name+' yet.<br>After your tee shot, walk to your ball and tap the green <b>DRIVE</b> button.</div>';
      const cs0=loadClubs(); const cks0=CLUBS.filter(c=>cs0[c]&&cs0[c].length);
      if(cks0.length){
        eh+='<div style="height:10px"></div><table class="card"><tr><th>Club</th><th>Avg</th><th>Best</th><th>#</th></tr>';
        cks0.forEach(c=>{const arr=cs0[c].map(x=>x.d);
          eh+=`<tr><td class="hn">${c}</td><td>${Math.round(arr.reduce((a,b)=>a+b,0)/arr.length)}</td><td class="tot">${Math.max(...arr)}</td><td>${arr.length}</td></tr>`;});
        eh+='</table><div class="topar">Club distances (all courses)</div>';
      }
      b.innerHTML=eh;return;}
    let all=[];
    let html='<table class="card"><tr><th>Hole</th><th>Last</th><th>Avg</th><th>Best</th><th>#</th></tr>';
    hs.forEach(h=>{
      const arr=drives[h].map(x=>x.d); all=all.concat(arr);
      const avg=Math.round(arr.reduce((a,b)=>a+b,0)/arr.length);
      html+=`<tr><td class="hn">${holeLabel(h)}</td><td>${arr[0]}</td><td>${avg}</td><td class="tot">${Math.max(...arr)}</td><td>${arr.length}</td></tr>`;
    });
    html+="</table>";
    const oAvg=Math.round(all.reduce((a,b)=>a+b,0)/all.length);
    html+=`<div class="topar"><b>${C.name}</b>: ${all.length} drives · avg <b>${oAvg}</b> · best <b>${Math.max(...all)}</b> yds</div>`;
    const cs=loadClubs(); const cks=CLUBS.filter(c=>cs[c]&&cs[c].length);
    if(cks.length){
      html+='<div style="height:10px"></div><table class="card"><tr><th>Club</th><th>Avg</th><th>Best</th><th>#</th></tr>';
      cks.forEach(c=>{const arr=cs[c].map(x=>x.d);
        html+=`<tr><td class="hn">${c}</td><td>${Math.round(arr.reduce((a,b)=>a+b,0)/arr.length)}</td><td class="tot">${Math.max(...arr)}</td><td>${arr.length}</td></tr>`;});
      html+='</table><div class="topar">Club distances (all courses)</div>';
    }
    html+='<div class="scoreactions"><button id="clearDrives" class="danger">CLEAR ALL DRIVES</button></div>';
    b.innerHTML=html;
    $("clearDrives").onclick=()=>{
      if(confirm("Delete all recorded drives for "+C.name+"?")){saveDrives({});renderScore();}
    };
  }else if(scoreTab==="hist"){
    const hist=loadHistory();
    if(!hist.length){b.innerHTML='<div class="topar">No saved rounds yet. Use FINISH & SAVE ROUND after your round.</div>';return;}
    let html="";
    hist.forEach((r,i)=>{
      const cn=(COURSES[r.c]||{}).name||r.c;
      html+=`<div class="prow histRow" data-i="${i}" style="align-items:flex-start;cursor:pointer"><span style="flex:1">
        <span class="pname">${cn}</span><br><span class="ptot">${r.d} · tap to view card</span><br>
        <span style="font-size:12.5px;color:var(--ink)">${r.players.map(p=>`${esc(p.name)} <b>${p.tot}</b> (${fmtToPar(p.toPar)}${p.played<holeNums().length?" thru "+p.played:""})${p.fwT?" · FWY "+p.fwH+"/"+p.fwT:""}${p.girT?" · GIR "+p.girH+"/"+p.girT:""}${p.puttHoles?" · "+p.putts+" putts":""}${p.pen?" · "+p.pen+" pen":""}`).join("<br>")}</span>
        ${driveLine(r)}
        </span><button data-i="${i}" class="delRound" style="background:none;border:none;color:#a1560f;font-size:16px;cursor:pointer;padding:4px">✕</button></div>
        <div class="histDetail" data-i="${i}" style="display:none;margin:-2px 0 10px"></div>`;
    });
    b.innerHTML=html;
    b.querySelectorAll(".delRound").forEach(btn=>btn.onclick=e=>{
      e.stopPropagation();
      if(!confirm("Delete this saved round?"))return;
      const h=loadHistory(); h.splice(+btn.dataset.i,1); saveHistory(h); renderScore();
    });
    b.querySelectorAll(".histRow").forEach(row=>row.onclick=()=>{
      const det=b.querySelector('.histDetail[data-i="'+row.dataset.i+'"]');
      if(det.style.display==="none"){det.innerHTML=roundDetail(hist[+row.dataset.i]);det.style.display="block";}
      else det.style.display="none";
    });
  }else{
    const hs=holeNums(), half=outCount();
    const front=hs.slice(0,half), back=hs.slice(half);
    const parOf=arr=>arr.reduce((a,h)=>a+(C.holes[h].alt?0:numPar(h)),0);
    const cell=(p,h)=>{const s=p.scores[h];if(!s)return"<td></td>";
      const d2=s-numPar(h);const c=d2<0?"under":(d2>0?"over":"");return`<td class="${c}">${s}</td>`;};
    let html=segTable(front,"Out",false);
    if(back.length) html+='<div style="height:10px"></div>'+segTable(back,"In",true);
    players.forEach(p=>{const st=pStats(p);
      if(st.played){
        let line=`<div class="topar"><b>${esc(p.name)}</b>: ${st.tot} thru ${st.played} · ${fmtToPar(st.toPar)}`;
        const bits=[];
        if(st.fwT)bits.push("FWY "+st.fwH+"/"+st.fwT);
        if(st.girT)bits.push("GIR "+st.girH+"/"+st.girT);
        if(st.puttHoles)bits.push(st.putts+" putts ("+st.puttHoles+" holes)");
        if(st.pen)bits.push(st.pen+" pen");
        if(bits.length)line+=" · "+bits.join(" · ");
        html+=line+"</div>";
      }});
    b.innerHTML=html;

    function segTable(seg,label,withTot){
      let t='<table class="card"><tr><th>Hole</th>'+seg.map(h=>`<th>${holeLabel(h)}</th>`).join("")+`<th>${label}</th>`+(withTot?"<th>Tot</th>":"")+"</tr>";
      t+="<tr><td class='hn'>Par</td>"+seg.map(h=>`<td class='hn'>${C.holes[h].par}</td>`).join("")+`<td class='hn'>${parOf(seg)}</td>`+(withTot?`<td class='hn'>${parOf(hs)}</td>`:"")+"</tr>";
      players.forEach(p=>{
        const st=pStats(p);
        const segSum=seg.reduce((a,h)=>a+(p.scores[h]||0),0);
        t+=`<tr><td class='hn'>${esc(p.name)}</td>`+seg.map(h=>cell(p,h)).join("")+`<td class='tot'>${segSum||""}</td>`+(withTot?`<td class='tot'>${st.tot||""}</td>`:"")+"</tr>";
      });
      return t+"</table>";
    }
  }
}
function drivesForRound(r){
  if(r.drives) return r.drives;
  // fallback: match all-time drives by this round's date + course
  let store={};
  try{const v=localStorage.getItem(r.c+":drives"); if(v) store=JSON.parse(v);}catch(e){}
  const out={};
  for(const h in store){
    const todays=store[h].filter(x=>x.t===r.d).map(x=>x.d);
    if(todays.length) out[h]=todays;
  }
  return Object.keys(out).length?out:null;
}
function roundDetail(r){
  const rc=COURSES[r.c];
  if(!rc) return '<div class="topar">Course data not available.</div>';
  const hs=Object.keys(rc.holes).map(Number).sort((a,b)=>a-b);
  const oc=rc.outCount||Math.ceil(hs.length/2);
  const front=hs.slice(0,oc), back=hs.slice(oc);
  const lbl=h=>rc.holes[h].label||h;
  const np=h=>parseInt(rc.holes[h].par);
  const parOf=arr=>arr.reduce((a,h)=>a+(rc.holes[h].alt?0:np(h)),0);
  const cell=(p,h)=>{const sc=p.scores?p.scores[h]:null;if(!sc)return"<td></td>";
    const d2=sc-np(h);const c=d2<0?"under":(d2>0?"over":"");return`<td class="${c}">${sc}</td>`;};
  function seg(segHs,label,withTot){
    let t='<table class="card"><tr><th>Hole</th>'+segHs.map(h=>`<th>${lbl(h)}</th>`).join("")+`<th>${label}</th>`+(withTot?"<th>Tot</th>":"")+"</tr>";
    t+="<tr><td class='hn'>Par</td>"+segHs.map(h=>`<td class='hn'>${rc.holes[h].par}</td>`).join("")+`<td class='hn'>${parOf(segHs)}</td>`+(withTot?`<td class='hn'>${parOf(hs)}</td>`:"")+"</tr>";
    r.players.forEach(p=>{
      const segSum=segHs.reduce((a,h)=>a+((p.scores&&p.scores[h])||0),0);
      t+=`<tr><td class='hn'>${esc(p.name)}</td>`+segHs.map(h=>cell(p,h)).join("")+`<td class='tot'>${segSum||""}</td>`+(withTot?`<td class='tot'>${p.tot||""}</td>`:"")+"</tr>";
      if(p.stats){
        const anyStat=segHs.some(h=>p.stats[h]);
        if(anyStat){
          t+=`<tr><td class='hn' style="font-size:9px">${esc(p.name)} ✓</td>`+segHs.map(h=>{
            const st=p.stats[h]||{};
            const marks=[st.fw==="y"?"F":"",st.gir==="y"?"G":"",st.putts?(st.putts+"p"):"",st.pen?("P"+st.pen):""].filter(Boolean).join(" ");
            return `<td style="font-size:9px;color:#1e7a45;font-weight:700">${marks}</td>`;
          }).join("")+"<td></td>"+(withTot?"<td></td>":"")+"</tr>";
        }
      }
    });
    const rd=drivesForRound(r);
    if(rd){
      t+="<tr><td class='hn'>Drive</td>"+segHs.map(h=>{
        const dArr=rd[h];return dArr&&dArr.length?`<td style="color:#1e7a45;font-weight:700">${Math.max(...dArr)}</td>`:"<td></td>";
      }).join("")+"<td></td>"+(withTot?"<td></td>":"")+"</tr>";
    }
    return t+"</table>";
  }
  let html=seg(front,"Out",false);
  if(back.length) html+='<div style="height:8px"></div>'+seg(back,"In",true);
  return html;
}
function driveLine(r){
  const rd=drivesForRound(r);
  if(!rd) return "";
  let all=[]; for(const h in rd) all=all.concat(rd[h]);
  if(!all.length) return "";
  const avg=Math.round(all.reduce((a,b)=>a+b,0)/all.length);
  return `<br><span style="font-size:11.5px;color:#1e7a45;font-weight:700">🏌️ ${all.length} drives · avg ${avg} · best ${Math.max(...all)} yds</span>`;
}
function renamePlayer(i){
  const n=prompt("Rename player:",players[i].name);
  if(n)players[i].name=n.trim().slice(0,14); saveScores(); renderScore();
}
$("btnScore").onclick=openScore;
$("scoreClose").onclick=closeScore;
$("scoreSheet").onclick=e=>{if(e.target.id==="scoreSheet")closeScore();};
$("tabHole").onclick=()=>{scoreTab="hole";renderScore();};
$("tabCard").onclick=()=>{scoreTab="card";renderScore();};
$("tabHist").onclick=()=>{scoreTab="hist";renderScore();};
$("tabDrives").onclick=()=>{scoreTab="drives";renderScore();};

/* ---------------- init ---------------- */
(()=>{
  // one-time migration: the original single-course app used cw:* keys
  try{
    const pairs=[["cw:players","caledonwoods:players"],["cw:greens","caledonwoods:greens"],["cw:tees","caledonwoods:tees"],["cw:tee","caledonwoods:tee"]];
    pairs.forEach(([oldK,newK])=>{
      const v=localStorage.getItem(oldK);
      if(v!==null && localStorage.getItem(newK)===null){
        localStorage.setItem(newK,v);
      }
    });
  }catch(e){}
  let start=null;
  try{start=localStorage.getItem("app:course");}catch(e){}
  if(!start || !COURSES[start]) start=Object.keys(COURSES)[0];
  loadCourse(start,true);
  if(Object.keys(COURSES).length>1) setStatus("Tap the course name to switch courses.");
})();
</script>
